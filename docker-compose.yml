version: "3.9"

services:
  client:
    build:
      context: ./apps/client
    container_name: pos-client

    ports:
      - "5173:5173"

    volumes:
      - ./apps/client:/app
      - /app/node_modules

    command: npm run dev -- --host

  server:
    build:
      context: ./apps/server

    container_name: pos-server

    ports:
      - "5000:5000"

    volumes:
      - ./apps/server:/app
      - /app/node_modules

    command: npm run dev
