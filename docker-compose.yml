version: "3.9"

services:
  mongodb:
    image: mongo
    container_name: pos-mongodb
    restart: always
    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    container_name: pos-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data:
