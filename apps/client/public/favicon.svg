<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="12"
    fill="#013220"
  />

  <!-- Shopping Cart -->
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Handle -->
    <path d="M18 18h7l4 18" />

    <!-- Basket -->
    <path d="M28 24h21l-3 12H31" />

    <!-- Bottom -->
    <path d="M31 40h15" />
  </g>

  <!-- Wheels -->
  <circle cx="28" cy="49" r="3.5" fill="#ffffff"/>
  <circle cx="44" cy="49" r="3.5" fill="#ffffff"/>
</svg>
